org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.enableR8.fullMode=true
# Let app build.gradle.kts abiFilters control ABIs (arm64-v8a + armeabi-v7a).
disable-abi-filtering=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Project is on D: and the Pub cache is on C:. Kotlin's incremental cache
# aborts with "this and base files have different roots" on that split.
kotlin.incremental=false
