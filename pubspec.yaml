name: air_docs_viewer
description: "Air Docs Viewer — offline document viewer by Crypto Sys Development"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # =========================
  # UI COMPONENTS
  # =========================
  fl_chart: ^1.2.0

  # =========================
  # STATE MANAGEMENT
  # =========================
  flutter_riverpod: ^3.3.1

  # =========================
  # ROUTING
  # =========================
  go_router: ^17.2.1

  # =========================
  # FILE SYSTEM
  # =========================
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  open_file: ^3.5.11

  # =========================
  # PDF VIEWER
  # =========================

  # =========================
  # OFFICE VISUAL VIEWER (DOCX / PPTX)
  # =========================
  # Bundled offline JS in assets/viewers (docx-preview + PPTXjs).
  # Legacy .doc / .ppt use structured POI/Dart parsers (not OOXML JS).

  # =========================
  # LEGACY FORMATS (DOC, XLS) & OPENOFFICE
  # =========================
  archive: ^4.0.9  # For ODP, ODS, ODT, DOCX, PPTX (zip-based)
  xml: ^6.6.1  # For parsing ODF/OOXML

  # =========================
  # XLSX
  # =========================
  # excel package removed — XLSX is parsed natively via Apache POI (platform channel)

  # =========================
  # LOCAL STORAGE
  # =========================
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # =========================
  # UTILITIES
  # =========================
  uuid: ^4.5.3
  logger: ^2.7.0

  # =========================
  # UI
  # =========================
  cupertino_icons: ^1.0.8  # Required for CupertinoIcons font

  # =========================
  # INTERNATIONALIZATION
  # =========================
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  pdfrx: ^2.2.24
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^9.0.1
  highlight: ^0.7.0
  video_player: ^2.11.1
  permission_handler: ^12.0.3
  # Must be a regular dependency so release Gradle (Android Studio signed APK)
  # includes the Android plugin on the classpath for GeneratedPluginRegistrant.
  flutter_native_splash: ^2.4.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter_native_splash:
  color: "#08251F"
  image: "assets/air_docs_logo_splash.png"
  image_dark: "assets/air_docs_logo_splash.png"
  android_gravity: fill
  android_12:
    color: "#08251F"
    image: "assets/air_docs_logo_splash.png"
    image_dark: "assets/air_docs_logo_splash.png"
    icon_background_color: "#08251F"
  fullscreen: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/air_docs_launcher.png"
  adaptive_icon_foreground: "assets/air_docs_adaptive_fg.png"
  adaptive_icon_background: "#08251F"
  adaptive_icon_foreground_inset: 14
  # Flavor-specific icons are generated via separate config files:
  # dart run flutter_launcher_icons -f flutter_launcher_icons-beta.yaml
  # dart run flutter_launcher_icons -f flutter_launcher_icons-prod.yaml

dependency_overrides:
  matcher: ^0.12.16
  test_api: ^0.7.0

flutter:
  uses-material-design: true
  generate: true  # Enable l10n code generation
  
  assets:
    - assets/air_docs_logo.png
    - assets/air_docs_emblem.png
    - assets/air_docs_launcher.png
    - assets/air_docs_adaptive_fg.png
    - assets/air_docs_splash_icon.png
    - assets/air_docs_logo_splash.png
    - assets/air_docs_splash_android12.png
    - assets/viewers/
    - assets/viewers/pptxjs/
  
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/ubuntu_regular.ttf
          weight: 400
